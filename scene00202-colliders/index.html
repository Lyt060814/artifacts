}

* {

}

html > body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

}

  text-decoration: none;
  text-underline-offset: 2px;
}

  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);

}

b,
strong,

code:not(pre code) {

}

.table-responsive {

}

.table {

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align="right"]) {

}

.table :is(.text-center, [align="center"]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {

  max-width: none !important;

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;

    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );

    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );

  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);

  pointer-events: none;

}

}

.viz-stat-value {

}

  align-items: center;
  gap: 4px;
}

  border-radius: var(--radius-full);

}

.progress-bar:only-child {

}

.progress-bar {

}

.text-small,
.viz-badge {

}

.text-muted {

}

.tabular-nums {

}

  width: 1px;
  height: 1px;
  padding: 0;

  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  min-width: min(100%, 260px);
  flex: 1 1 280px;

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {

  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;

  border: 1px solid var(--input);

.viz-dotted-background {
  background-image: radial-gradient(

    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel > [data-variant][hidden] {

}

.viz-carousel > [data-variant] {

}

.viz-carousel-controls {

  gap: 0;

  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);

  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;

.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;

  background: transparent !important;
  font: inherit !important;

.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls > button > svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls > button::before,
.viz-carousel-picker > summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: "";
  pointer-events: none;
}

.viz-carousel-controls > button:hover::before,
.viz-carousel-picker > summary:hover::before {

<script>
(() => {
  const root = document.getElementById('scene00202-colliders');
  const data = JSON.parse(document.getElementById('cw-data').textContent);
  const q = id => root.querySelector('#cw-'+id);
  const objects = data.objects, regions = data.regions;
  const byName = new Map(objects.map(o => [o.n, o]));
  const regionByKey = new Map(regions.map(r => [r.key,r]));
  const saved = window.openai?.widgetState;
  let state = { scope:'object', area:'all', selected:'decoration_set', view:'decoration_set_vase', mode:2, search:'', sort:'shapes', kind:'all', page:0 };
  const nfmt = value => Number(value).toLocaleString('zh-CN');
  function restore(snapshot) {
    if (!snapshot) return;
    const s = snapshot.privateContent;
    if (!s || s.version !== data.version) return;
    state = {...state,...s.ui};
    if (!['object','region'].includes(state.scope)) state.scope='object';
    if (!regionByKey.has(state.area) && state.area!=='all') state.area='all';
    if (![0,1,2].includes(state.mode)) state.mode=2;
  }
  restore(saved);
  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{scene:'scene002.02',head:data.manifest.head,selected:state.selected,view:state.view,mode:['可视几何','碰撞近似','叠加对照'][state.mode]},privateContent:{version:data.version,ui:state}}).catch(() => {});
  }
  const t = data.totals;
  q('coverage').textContent=data.coverage;
  q('census').textContent = `${t.entity_objects} 个对象（含背景、地毯） · ${t.objects_with_colliders} 个带碰撞 · ${t.bodies} 刚体（${t.kinematic_bodies} 运动学） · ${t.colliders} 启用碰撞基元 = ${t.native} 原生 + ${t.hulls} 凸包 + ${t.other} 其他`;
  for (const r of regions) q('area').add(new Option(r.label,r.key));
  function views() {return state.scope==='object' ? byName.get(state.selected).v : regionByKey.get(state.selected).views;}
  function syncPick() {
    q('scope').value=state.scope;q('area').value=state.area;
    q('pick').replaceChildren();
    const list=state.scope==='region' ? regions.filter(r=>state.area==='all'||r.key===state.area).map(r=>[r.key,r.label]) : objects.filter(o=>state.area==='all'||o.r===state.area).sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true})).map(o=>[o.n,o.n]);
    if (!list.some(([key])=>key===state.selected)) {state.selected=list[0][0];state.view='';}
    for (const [key,label] of list) q('pick').add(new Option(label,key));
    q('pick').value=state.selected;
    q('view').replaceChildren();
    const viewList=views();
    if (!viewList.some(v=>v[0]===state.view)) state.view=viewList[0][0];
    for (const [key,label] of viewList) q('view').add(new Option(label,key));
    q('view').value=state.view;
  }
  function show() {
    syncPick();
    q('image').src=data.images[state.view];
    q('full-links').replaceChildren();
    if(data.standalone) {
      for(const [mode,label] of [['visual','可视原图'],['collider','碰撞原图'],['overlay','叠加原图']]) {
        const a=document.createElement('a');a.href=data.full_images[state.view][mode];a.target='_blank';a.rel='noopener';a.textContent=label;q('full-links').append(a);
      }
      const gallery=document.createElement('a');gallery.href=data.gallery+'#'+state.view;gallery.textContent='全分辨率图库';q('full-links').append(gallery);
      if(data.download && ['http:','https:'].includes(location.protocol)) {
        const download=document.createElement('a');download.href=data.download;download.download=data.download;download.textContent='网页 ZIP';q('full-links').append(download);
      }
    }
    q('image').style.transform=`translateX(${-100*state.mode/3}%)`;
    q('image').alt=`${state.selected} · ${q('view').selectedOptions[0].textContent} · ${['可视几何','碰撞近似','叠加对照'][state.mode]}`;
    for (const b of q('modes').querySelectorAll('button')) b.setAttribute('aria-pressed',String(Number(b.dataset.mode)===state.mode));
    q('body-rows').replaceChildren();
    if (state.scope==='object') {
      const o=byName.get(state.selected);
      q('selection').textContent=`${o.n} · 此图 ${data.view_shapes[state.view]} 形状 · 对象合计 ${o.c} 形状（${o.na} 原生 / ${o.h} 凸包 / ${o.ot} 其他） · ${o.b} 刚体 · 最大单体 ${o.maxb} 形状`;
      const variant=o.rep!==o.n ? `代表图：${o.rep}（同源变体；本行独立清点） · ` : '';
      q('detail').textContent=variant+`对象源网格 ${nfmt(o.vv)} 顶点 / ${nfmt(o.vt)} 三角面 · 凸包最大 ${o.hm} 顶点 · ${o.asset}`+(o.note ? ' · '+o.note : '');
      q('bodies').hidden=false;
      for (const b of [...o.bd].sort((a,b)=>b[1]-a[1])) {
        const tr=document.createElement('tr');
        for (const text of [b[0],b[2]?'运动学':'动态',b[1],b[3]===null?'未显式指定':Number(b[3].toPrecision(5))]) {
          const td=document.createElement('td');td.textContent=text;td.className='cw-body';tr.append(td);
        }
        q('body-rows').append(tr);
      }
      if (o.static) {const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.textContent=`无刚体归属的静态形状：${o.static}`;tr.append(td);q('body-rows').append(tr);}
    } else {
      const r=regionByKey.get(state.selected);const selected=objects.filter(o=>r.names.includes(o.n));
      q('selection').textContent=`${r.label} · 此图 ${data.view_shapes[state.view]} 形状 · 区域合计 ${selected.length} 个对象 · ${selected.reduce((a,o)=>a+o.c,0)} 启用碰撞基元`;
      q('detail').textContent=r.names.join('、');q('bodies').hidden=true;
    }
  }
  function table() {
    const search=state.search.toLowerCase();
    const filtered=objects.filter(o=>(state.area==='all'||o.r===state.area)&&(!search||[o.n,o.asset,...o.bd.map(b=>b[0])].join(' ').toLowerCase().includes(search))&&(state.kind==='all'||(state.kind==='none'?o.c===0:state.kind==='native'?o.na>0:state.kind==='hull'?o.h>0:o.ot>0)));
    filtered.sort((a,b)=>state.sort==='name'?a.n.localeCompare(b.n,undefined,{numeric:true}):(state.sort==='body'?b.maxb-a.maxb:state.sort==='vertices'?b.vv-a.vv:b.c-a.c)||a.n.localeCompare(b.n));
    const pages=Math.max(1,Math.ceil(filtered.length/12));state.page=Math.max(0,Math.min(state.page,pages-1));
    q('table-count').textContent=`${filtered.length} / ${objects.length} 个对象 · 当前筛选 ${filtered.reduce((a,o)=>a+o.c,0)} 启用碰撞基元`;
    q('rows').replaceChildren();
    for (const o of filtered.slice(state.page*12,(state.page+1)*12)) {
      const tr=document.createElement('tr');const td=document.createElement('td');const button=document.createElement('button');
      button.type='button';button.className='btn btn-ghost';button.textContent=o.n;button.setAttribute('aria-pressed',String(state.scope==='object'&&state.selected===o.n));
      button.addEventListener('click',()=>{state.scope='object';state.selected=o.n;state.view='';show();table();save();});td.append(button);tr.append(td);
      for (const value of [`${o.b} / ${o.k}`,`${o.na} / ${o.h} / ${o.ot}`,o.maxb,nfmt(o.vv),`${nfmt(o.hp)} / ${nfmt(o.hv)}`]) {const cell=document.createElement('td');cell.textContent=value;cell.className='tabular-nums';tr.append(cell);}
      q('rows').append(tr);
    }
    q('page').textContent=`${state.page+1} / ${pages}`;q('prev').disabled=state.page===0;q('next').disabled=state.page===pages-1;
    q('search').value=state.search;q('sort').value=state.sort;q('kind').value=state.kind;
  }
  q('scope').addEventListener('change',e=>{state.scope=e.target.value;state.selected='';state.view='';show();table();save();});
  q('area').addEventListener('change',e=>{state.area=e.target.value;state.page=0;show();table();save();});
  q('pick').addEventListener('change',e=>{state.selected=e.target.value;state.view='';show();table();save();});
  q('view').addEventListener('change',e=>{state.view=e.target.value;show();save();});
  q('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.mode=Number(b.dataset.mode);show();save();});
  q('search').addEventListener('input',e=>{state.search=e.target.value;state.page=0;table();save();});
  q('sort').addEventListener('change',e=>{state.sort=e.target.value;state.page=0;table();save();});
  q('kind').addEventListener('change',e=>{state.kind=e.target.value;state.page=0;table();save();});
  q('prev').addEventListener('click',()=>{state.page--;table();save();});q('next').addEventListener('click',()=>{state.page++;table();save();});
  q('method').textContent='USD 编写统计 · 非 PhysX 烹制结果 · 非运行时接触/性能测试；原生形状图片为检查用离散表面；convexDecomposition 仅算输入基元；可视网格采用继承 visibility/purpose、默认时刻与多边形扇形三角化（不应用纹理或细分）；实例代理完整遍历；背景 13 形状计入，其中天花板为 boundingCube；地毯无碰撞；单凸包超默认 64 几何顶点：0。';
  q('method').textContent+=' 独立清点：'+data.reference_status+'。';
  const m=data.manifest;
  q('provenance').textContent=`构建 UTC：${m.build_timestamp}\n分支：${m.branch}\nHEAD：${m.head}\n源：${m.scene}\n场景 SHA256：${m.scene_sha256}\n源层清单 SHA256：${m.layer_manifest_sha256}\n使用源层：${m.used_source_layers.length}\n\n`+m.used_source_layers.map(l=>`${l.sha256}  ${l.path}`).join('\n');
  window.addEventListener('openai:set_globals',e=>{const snapshot=e.detail?.globals?.widgetState;if(snapshot){restore(snapshot);show();table();}});
  show();table();
})();
</script>

</body></html>
